services:
  reverse-proxy:
    image: caddy:2.8-alpine
    container_name: rts-mk1-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - rts_mk1_caddy_data:/data
      - rts_mk1_caddy_config:/config
    depends_on:
      - web
      - ws-server
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - rts-mk1-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: rts-mk1-web:v1.15.0
    container_name: rts-mk1-web
    restart: unless-stopped
    user: "node"
    environment:
      - NODE_ENV=production
      - APP_VERSION=1.15.0
      - PORT=4300
      - WEB_PORT=4300
      - PROJECT_NAME=RTS-MK1
      - PUBLIC_DNS_DOMAIN=rts-mk1.orbital8.cloud
      - NEXT_PUBLIC_APP_URL=https://rts-mk1.orbital8.cloud
      - NEXT_PUBLIC_WS_URL=wss://rts-mk1.orbital8.cloud/ws
      - INTERNAL_WS_API_URL=http://ws-server:4301
      - RTS_DB_PATH=/app/data/rts-mk1.sqlite
    volumes:
      - rts_mk1_data:/app/data
    expose:
      - "4300"
    depends_on:
      - db
      - ws-server
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    networks:
      - rts-mk1-net

  ws-server:
    build:
      context: .
      dockerfile: Dockerfile.ws
    image: rts-mk1-ws:v1.15.0
    container_name: rts-mk1-ws
    restart: unless-stopped
    user: "node"
    environment:
      - NODE_ENV=production
      - APP_VERSION=1.15.0
      - WS_PORT=4301
      - PROJECT_NAME=RTS-MK1
      - PUBLIC_DNS_DOMAIN=rts-mk1.orbital8.cloud
      - NEXT_PUBLIC_APP_URL=https://rts-mk1.orbital8.cloud
      - NEXT_PUBLIC_WS_URL=wss://rts-mk1.orbital8.cloud/ws
      - INTERNAL_WS_API_URL=http://ws-server:4301
      - RTS_DB_PATH=/app/data/rts-mk1.sqlite
    volumes:
      - rts_mk1_data:/app/data
    expose:
      - "4301"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    networks:
      - rts-mk1-net

  db:
    image: node:24-slim
    container_name: rts-mk1-db
    restart: unless-stopped
    user: "node"
    working_dir: /app/data
    command: ["node", "-e", "setInterval(() => {}, 3600000)"]
    volumes:
      - rts_mk1_data:/app/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - rts-mk1-net

volumes:
  rts_mk1_data:
  rts_mk1_caddy_data:
  rts_mk1_caddy_config:

networks:
  rts-mk1-net:
    driver: bridge
